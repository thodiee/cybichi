          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- B Top Loop -->
    <path d="M 174 84
             L 196 84
             C 214 84, 224 92, 224 103
             C 224 114, 214 120, 196 120
             L 174 120"
          fill="none"
          stroke="#1B60B4"
