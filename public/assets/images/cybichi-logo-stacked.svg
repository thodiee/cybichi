          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- B Bottom Loop -->
    <path d="M 174 120
             L 198 120
             C 218 120, 228 128, 228 138
             C 228 156, 216 156, 198 156
             L 174 156"
          fill="none"
          stroke="#1B60B4"
