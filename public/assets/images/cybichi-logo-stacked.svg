          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Brand Name -->
    <text x="180" y="262" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">
        <tspan fill="#0C2340">CYB</tspan><tspan fill="#00A3E0">ICHI</tspan>
    </text>

    <!-- Tagline -->
    <text x="180" y="282" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.8" letter-spacing="2.8" fill="#0C2340">
