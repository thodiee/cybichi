<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%" fill="none">
    <!-- Shield Contour -->
    <path d="M 108 42
             C 142 54, 168 54, 180 54
             C 192 54, 218 54, 252 42
             C 268 42, 276 52, 274 68
             L 267 132
             C 259 180, 222 210, 180 226
             C 138 210, 101 180, 93 132
             L 86 68
             C 84 52, 92 42, 108 42 Z"
          fill="none" 
          stroke="#1B60B4" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- ECG Pulse into M + B -->
    <path d="M 68 116
             L 112 116
             L 118 126
             L 136 64
             L 155 168
             L 174 84
             L 174 156"
          fill="none"
          stroke="#1B60B4"
