<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-net" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-net)"/>
  <circle cx="500" cy="90" r="130" fill="#0D9488" opacity="0.12" filter="blur(40px)"/>
  
  <rect x="40" y="35" width="520" height="330" rx="12" fill="#021C16" stroke="#115E59" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="38" rx="12" fill="#042F2E"/>
  <rect x="40" y="60" width="520" height="13" fill="#042F2E"/>
  <circle cx="65" cy="54" r="5" fill="#EF4444"/>
  <circle cx="82" cy="54" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="54" r="5" fill="#10B981"/>
  <text x="130" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5EEAD4">netflow.cybichi.com — RouterOS v7 NOC Dashboard</text>
  
  <text x="65" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#F0FDFA">🌐 CYBICHI NETWORK OPERATIONS CENTER</text>
  
  <!-- Network Stats Grid -->
  <g transform="translate(65, 125)">
    <rect width="145" height="70" rx="8" fill="#042F2E" stroke="#134E4A"/>
    <text x="15" y="24" font-family="sans-serif" font-size="10" fill="#99F6E4">Throughput Multi-WAN</text>
    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18" fill="#2DD4BF">942.8 Mbps</text>
    <text x="15" y="62" font-family="sans-serif" font-size="8" fill="#34D399">● Fiber Optic Link OK</text>
  </g>
  <g transform="translate(225, 125)">
    <rect width="145" height="70" rx="8" fill="#042F2E" stroke="#134E4A"/>
    <text x="15" y="24" font-family="sans-serif" font-size="10" fill="#99F6E4">Voucher Hotspot Aktif</text>
    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18" fill="#2DD4BF">384 Tamu</text>
    <text x="15" y="62" font-family="sans-serif" font-size="8" fill="#38BDF8">VLAN 20 Isolated</text>
  </g>
  <g transform="translate(385, 125)">
    <rect width="150" height="70" rx="8" fill="#042F2E" stroke="#134E4A"/>
    <text x="15" y="24" font-family="sans-serif" font-size="10" fill="#99F6E4">Latency Gateway (BGP)</text>
    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18" fill="#2DD4BF">4.2 ms</text>
    <text x="15" y="62" font-family="sans-serif" font-size="8" fill="#34D399">Packet Loss: 0.00%</text>
  </g>
  
  <!-- Live Bandwidth Wave & Router Ports -->
  <g transform="translate(65, 210)">
    <rect width="470" height="135" rx="8" fill="#042F2E" stroke="#134E4A"/>
    <text x="15" y="24" font-family="sans-serif" font-weight="600" font-size="11" fill="#CCFBF1">Live Traffic Queue Tree (ether1 WAN1 &amp; ether2 WAN2)</text>
    
    <!-- Traffic waveform -->
    <path d="M15 110 L60 85 L100 95 L140 60 L180 75 L220 40 L260 65 L300 45 L340 70 L380 50 L420 65 L455 35" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15 110 L60 85 L100 95 L140 60 L180 75 L220 40 L260 65 L300 45 L340 70 L380 50 L420 65 L455 35 L455 125 L15 125 Z" fill="#2DD4BF" opacity="0.15"/>
    
    <path d="M15 115 L60 100 L100 105 L140 85 L180 95 L220 70 L260 85 L300 75 L340 90 L380 80 L420 85 L455 65" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>
