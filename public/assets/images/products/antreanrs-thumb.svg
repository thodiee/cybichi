      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-antrean)"/>
  <circle cx="500" cy="90" r="130" fill="#0D9488" opacity="0.12" filter="blur(40px)"/>
  
  <rect x="40" y="35" width="520" height="330" rx="12" fill="#0B132B" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="38" rx="12" fill="#0F2926"/>
  <rect x="40" y="60" width="520" height="13" fill="#0F2926"/>
  <circle cx="65" cy="54" r="5" fill="#EF4444"/>
  <circle cx="82" cy="54" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="54" r="5" fill="#10B981"/>
  <text x="130" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5EEAD4">antreanrs.cybichi.com — Display Ruang Tunggu Poli</text>
  
  <!-- Hospital Header -->
  <text x="65" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#F0FDFA">🏥 RSIA SEHAT SENTOSA • PANGGILAN ANTREAN</text>
  
  <!-- Big Active Queue Card -->
