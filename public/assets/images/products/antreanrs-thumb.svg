    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#F0FDFA">B-018</text>
    <text x="110" y="48" font-family="sans-serif" font-size="10" fill="#14B8A6">Menunggu 3</text>
    
    <rect y="75" width="190" height="65" rx="8" fill="#0F2926" stroke="#134E4A"/>
    <text x="15" y="99" font-family="sans-serif" font-size="10" fill="#5EEAD4">POLI PENYAKIT DALAM</text>
    <text x="15" y="123" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#F0FDFA">C-031</text>
    <text x="110" y="123" font-family="sans-serif" font-size="10" fill="#14B8A6">Menunggu 5</text>
    
    <rect y="150" width="190" height="65" rx="8" fill="#0F2926" stroke="#134E4A"/>
    <text x="15" y="174" font-family="sans-serif" font-size="10" fill="#5EEAD4">LOKET FARMASI &amp; OBAT</text>
    <text x="15" y="198" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#F0FDFA">F-089</text>
