    <rect x="20" y="145" width="220" height="30" rx="6" fill="#134E4A"/>
    <text x="30" y="165" font-family="sans-serif" font-weight="700" font-size="13" fill="#F0FDFA">POLI ANAK • RUANG 03</text>
    <text x="20" y="195" font-family="sans-serif" font-size="11" fill="#99F6E4">dr. Hendra Wijaya, Sp.A</text>
  </g>
  
  <!-- Right Poliklinik List -->
  <g transform="translate(345, 125)">
